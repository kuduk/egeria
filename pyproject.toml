[project]
name = "egeria"
version = "0.1.0"
description = "Modello decisionale semantico System 1 su Qwen3.5: baseline zero-shot con readout dei logit delle opzioni (stile SemIf), API compatibile Jev"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
model = [
    "torch>=2.8",
    "transformers>=5.9",  # 5.9.0 corregge il leak di stato DeltaNet fra campioni impacchettati
    "accelerate>=1.10",
    "safetensors>=0.6",
    "huggingface-hub>=1.0",
]
quant = ["bitsandbytes>=0.46"]
# Kernel veloci per i layer Gated DeltaNet (senza, transformers usa il fallback PyTorch, molto più lento).
# causal-conv1d si compila con nvcc: vedi documentazione/03-baseline-f0.md
fast = ["flash-linear-attention>=0.2.2", "causal-conv1d>=1.5"]
eval = ["pyarrow>=17"]
# Stati con immagini: torre visiva di Qwen3.5 e processore di immagini.
vision = ["pillow>=10", "torchvision>=0.26"]
# Interfaccia web (console, monitor, memoria) e API /v1/systemone.
server = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8", "httpx>=0.27"]
# Collaudo dell'interfaccia nel browser (scripts/collaudo_ui.py); poi: python -m playwright install chromium
ui-test = ["playwright>=1.40"]

[project.scripts]
egeria = "egeria.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/egeria"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: richiede il download di un modello Qwen3.5 (impostare EGERIA_TEST_MODEL)"]
